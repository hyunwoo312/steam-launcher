name: Release

# Releases are triggered by bumping "Version" in plugin.json and merging to main.
# The check job skips the release when v<version> already exists, so ordinary merges
# are a no-op. The tag is created from plugin.json rather than checked against it,
# so the two cannot drift.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .Version src/Flow.Launcher.Plugin.SteamLauncher/plugin.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify changelog entry
        shell: pwsh
        run: ./scripts/changelog.ps1 -Check

      - name: Test
        run: dotnet test src/Flow.Launcher.Plugin.SteamLauncher.Tests/Flow.Launcher.Plugin.SteamLauncher.Tests.csproj -c Release

      - name: Publish (Release)
        run: dotnet publish src/Flow.Launcher.Plugin.SteamLauncher/Flow.Launcher.Plugin.SteamLauncher.csproj -c Release -o publish

      # The zip name is fixed: Flow's manifest bot matches the release asset by filename.
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "publish/*" -DestinationPath "Flow.Launcher.Plugin.SteamLauncher.zip" -Force

      - name: Generate release notes
        shell: pwsh
        run: ./scripts/changelog.ps1 -ReleaseBody $env:VERSION | Out-File release-notes.md -Encoding utf8

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "Flow.Launcher.Plugin.SteamLauncher.zip" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
